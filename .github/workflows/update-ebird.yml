name: Update eBird observations

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-ebird.mjs'
      - 'dist/index.html'
      - '.github/workflows/update-ebird.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run update:ebird
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      - name: Commit refreshed local reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/observations.json
          git diff --cached --quiet || git commit -m "Refresh eBird hotspot reports"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
