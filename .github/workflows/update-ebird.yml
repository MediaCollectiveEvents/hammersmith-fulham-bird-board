name: Update eBird observations

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run update:ebird
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      - name: Commit refreshed local reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/observations.json
          git diff --cached --quiet || git commit -m "Refresh eBird hotspot reports"
          git push
