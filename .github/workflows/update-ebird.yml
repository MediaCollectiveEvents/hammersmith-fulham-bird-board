name: Update eBird observations

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-ebird.mjs'
      - 'dist/borough-hotspots.mjs'
      - 'dist/sightings-months.mjs'
      - 'scripts/archive-sightings.mjs'
      - 'scripts/update-wetland-ebird.mjs'
      - 'scripts/update-birdweather.mjs'
      - '.github/workflows/update-ebird.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: ebird-feed-refresh
      cancel-in-progress: false
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Refresh borough eBird records
        id: borough
        run: npm run update:ebird
        continue-on-error: true
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      - name: Retain monthly borough sightings
        id: archive
        continue-on-error: true
        if: steps.borough.outcome == 'success'
        run: npm run archive:sightings
      - name: Refresh BirdWeather detections
        id: birdweather
        run: npm run update:birdweather
        continue-on-error: true
      - name: Refresh WWT hotspot records
        id: wetland
        continue-on-error: true
        run: npm run update:wetland
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      - name: Validate candidate feeds and archives before committing
        run: node scripts/validate-pr-data.mjs
      - name: Commit refreshed local reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/observations.json dist/data/birdweather.json dist/data/wetland-centre-observations.json dist/data/sightings-archive/*.json
          git diff --cached --quiet || git commit -m "Refresh bird observation feeds"
          # A concurrent main update rejects this push; never force or discard it.
          git push origin HEAD:main
      - name: Surface partial refresh failures after preserving validated successes
        if: >-
          always() &&
          (steps.borough.outcome == 'failure' || steps.archive.outcome == 'failure' ||
           steps.birdweather.outcome == 'failure' || steps.wetland.outcome == 'failure')
        run: |
          echo "A feed/archive step failed. Validated successes were committed if candidate validation and push succeeded. Existing failed-feed snapshots remain last-known-good; inspect this run." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Preserve public candidate files for recovery if validation or push fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feed-refresh-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            dist/data/observations.json
            dist/data/birdweather.json
            dist/data/wetland-centre-observations.json
            dist/data/sightings-archive/*.json
